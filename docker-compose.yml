services:
  app:
    build: .
    ports:
      - "80:80"
    environment:
      DB_HOST: db
      DB_PORT: "3306"
      DB_NAME: forli_despacho
      DB_USER: forli
      DB_PASS: forli2026
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: root2026
      MYSQL_DATABASE: forli_despacho
      MYSQL_USER: forli
      MYSQL_PASSWORD: forli2026
    volumes:
      - mysql_data:/var/lib/mysql
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mysql_data:
